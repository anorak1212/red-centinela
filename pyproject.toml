[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["motor", "api", "tablero", "alertas", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["motor", "api", "alertas", "cli"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80