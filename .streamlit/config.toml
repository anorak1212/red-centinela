[theme]
base = "light"
primaryColor = "#0a7a58"
backgroundColor = "#f4f7f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#10201c"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
