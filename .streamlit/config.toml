[theme]
base = "light"
primaryColor = "#2450d6"
backgroundColor = "#f3f5f9"
secondaryBackgroundColor = "#eef1f7"
textColor = "#0d1626"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
